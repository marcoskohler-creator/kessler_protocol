[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kessler-protocol"
dynamic = ["version"]
description = "A deterministic, risk-proportional safety and evidence layer for agentic coding assistants."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Marcos Kohler"}]
keywords = ["agentic-coding", "ai-coding", "antigravity", "gemini-cli", "red-team", "software-engineering", "ai-safety", "verification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
kessler = "kessler_protocol.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kessler_protocol.data" = ["*.json"]

[tool.setuptools_scm]
